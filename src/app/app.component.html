<main class="min-h-screen w-full bg-gradient-to-br from-gray-50 to-gray-100 flex flex-col">

  <div class="flex-1 flex flex-col justify-center">
  
    <header class="w-full bg-white py-6 md:py-10 px-4 md:px-12 shadow-sm md:shadow-md">
      <div class="max-w-7xl mx-auto">
        <h1 class="text-center text-gray-800 font-semibold text-lg md:text-2xl tracking-wide md:tracking-wider">
          ACTION LABS
        </h1>
      </div>
    </header>

    <div class="border-t border-gray-200"></div>

    <section class="flex-1 w-full bg-white px-4 md:px-12 py-8 md:py-16">
      <div class="max-w-7xl mx-auto">

        <div class="mb-8 md:mb-16 text-center">
          <h1 class="text-cyan-400 text-2xl md:text-5xl font-bold tracking-wide md:tracking-wider mb-2 md:mb-4">
            BRL EXCHANGE RATE
          </h1>
          <div class="hidden md:block w-24 h-1 bg-gradient-to-r from-transparent via-cyan-400 to-transparent mx-auto"></div>
        </div>

        <div class="flex flex-col items-center">
          <app-search-form (search)="onSearch($event)" class="w-full max-w-md"></app-search-form>

          <app-current-rate
            *ngIf="currentRate"
            [exchangeRate]="currentRate"
            (toggleHistory)="onToggleHistory($event)"
            class="mt-8 md:mt-16 w-full max-w-5xl"
          ></app-current-rate>

          <app-history-list
            *ngIf="showHistory && history.length"
            [history]="history"
            class="mt-8 md:mt-16 w-full max-w-7xl"
          ></app-history-list>
        </div>
      </div>
    </section>

 
    <div class="md:hidden bg-cyan-400 text-white text-center py-4 text-sm">
      Copyright 2022 - Action Labs
    </div>
  </div>


  <footer class="hidden md:block bg-gradient-to-t from-gray-100 to-transparent text-gray-500 text-center py-8 text-sm">
    <div class="max-w-7xl mx-auto">
      <p class="tracking-wide">Copyright 2022 - Action Labs</p>
    </div>
  </footer>
</main>
