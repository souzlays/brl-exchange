<main class="min-h-screen bg-gradient-to-br from-gray-50 to-gray-100 flex flex-col">

  <div class="flex-1 flex flex-col items-center justify-center px-4 py-8 md:py-12">
  
    <div class="w-full max-w-md md:max-w-2xl lg:max-w-4xl">
        <div class="pt-8 pb-6 px-6 md:pt-12 md:pb-8 bg-white">
          <h1>
            ACTION LABS
          </h1>
        </div>

   
        <div class="border-t border-gray-200"></div>


        <div class="px-6 py-8 md:px-12 md:py-12 bg-white">

          <h1 class="text-cyan-400 text-2xl md:text-3xl lg:text-4xl font-bold text-center mb-8 md:mb-12 tracking-wide">
            BRL EXCHANGE RATE
          </h1>

          <app-search-form (search)="onSearch($event)"></app-search-form>

          <app-current-rate
            *ngIf="currentRate"
            [exchangeRate]="currentRate"
            (toggleHistory)="onToggleHistory($event)"
            class="mt-8 md:mt-12"
          ></app-current-rate>


          <app-history-list
            *ngIf="showHistory && history.length"
            [history]="history"
            class="mt-8 md:mt-12"
          ></app-history-list>
        </div>


        <div class="md:hidden bg-cyan-400 text-white text-center py-4 text-sm">
          Copyright 2022 - Action Labs
        </div>
    
    </div>
  </div>


  <footer class="hidden md:block bg-transparent text-gray-600 text-center py-6 text-sm">
    Copyright 2022 - Action Labs
  </footer>
</main>
