<form (ngSubmit)="onSubmit()" class="w-full max-w-md mx-auto">
  <div class="mb-6">
    <input
      type="text"
      placeholder="Enter the currency code"
      [(ngModel)]="currencyCode"
      name="currencyCode"
      required
      class="w-full px-4 py-3 text-gray-700 bg-gray-100 border-0 rounded-lg focus:outline-none focus:ring-2 focus:ring-cyan-400 transition-all"
    />

    <div class="min-h-6 mt-5">
      <span
        *ngIf="showError"
        class="block text-red-500 text-sm wrap-break-word"
      >
        Please enter a valid 3-letter currency code (e.g. USD, BRL, EUR)
      </span>
    </div>
  </div>

  <button 
    type="submit"
    class="w-full py-4 bg-cyan-400 hover:bg-cyan-500 text-white font-bold rounded-full transition-all transform hover:scale-105 active:scale-95 shadow-lg"
  >
    EXCHANGE RESULT
  </button>
</form>
