<section class="w-full max-w-md mx-auto" *ngIf="exchangeRate">
  <div class="bg-white rounded-lg overflow-hidden">
    
    <div class="flex items-start justify-between px-6 py-4 md:px-8 md:py-6">
      <div class="flex flex-col">
        <p class="text-gray-800 font-semibold text-base md:text-lg mb-1">
          Exchange rate now
        </p>
        <span class="text-gray-500 text-xs md:text-sm">
          {{ exchangeRate.lastUpdatedAt | date: 'dd/MM/yyyy - HH:mm' }}
        </span>
      </div>
    
      <strong class="text-cyan-400 text-xl md:text-2xl font-bold">
        {{ exchangeRate.fromSymbol }}/BRL
      </strong>
    </div>

    <div class="bg-cyan-50 px-6 py-6 md:px-8 md:py-8">
      <div class="text-cyan-400 text-4xl md:text-5xl font-bold text-center">
        R$ {{ exchangeRate.exchangeRate | number: '1.2-2' }}
      </div>
    </div>

    <div class="px-6 py-4 md:px-8 md:py-5 border-t border-gray-200">
      <button 
        (click)="onToggle()"
        class="w-full flex items-center justify-between text-left group hover:bg-gray-50 rounded-lg px-4 py-3 transition-all"
      >
        <span class="text-gray-800 font-semibold text-sm md:text-base uppercase tracking-wide">
          LAST 30 DAYS
        </span>
        <svg 
          class="w-6 h-6 text-cyan-400 transform transition-transform group-hover:translate-x-1" 
          fill="none" 
          stroke="currentColor" 
          viewBox="0 0 24 24"
        >
          <path 
            stroke-linecap="round" 
            stroke-linejoin="round" 
            stroke-width="3" 
            d="M12 4v16m8-8H4"
          />
        </svg>
      </button>
    </div>
  </div>
</section>
